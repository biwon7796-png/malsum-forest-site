:root{--site-h:76px}
.bar{top:var(--bar-top,var(--site-h))}

<script>
/* 사이트 공통 메뉴의 실제 높이를 --site-h 로, 진행 막대의 위치를 --bar-top 으로 알린다(화면 폭에 따라 달라짐). 앱 코드(js/spread.js)가 --site-h 를 읽는다. */
(function(){var h=document.querySelector('.site-header'),r=document.documentElement;if(!h)return;
function s(){var H=h.offsetHeight;r.style.setProperty('--site-h',H+'px');
  r.style.setProperty('--bar-top',(getComputedStyle(h).position==='sticky'?H:Math.max(0,H-(window.pageYOffset||0)))+'px')}
s();addEventListener('resize',s);addEventListener('load',s);addEventListener('scroll',s,{passive:true});if(window.ResizeObserver)new ResizeObserver(s).observe(h)})();
</script>
